<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Spending Copilot — 거래 조회 (toy)</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 16px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 1.3rem; }
  p.sub { color: #666; margin-top: -8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e0e0e0; font-size: 0.92rem; }
  th { color: #555; font-weight: 600; }
  .decision-confirm { color: #1a7f37; font-weight: 600; }
  .decision-escalate { color: #b3542a; font-weight: 600; }
  #empty { color: #888; margin-top: 24px; }
  #refresh { margin-top: 12px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
  <h1>가맹점 판단 결과 조회</h1>
  <p class="sub">poc/merchant_judgment_live_demo.py 실행 결과가 SQLite에 저장되고, 여기서 API로 조회합니다.</p>
  <button id="refresh">새로고침</button>
  <table id="table" style="display:none">
    <thead>
      <tr><th>ID</th><th>가맹점</th><th>금액</th><th>카테고리</th><th>판정</th><th>확신도</th><th>이유</th><th>시각</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p id="empty">아직 저장된 거래가 없습니다. 데모 스크립트를 먼저 실행하세요.</p>

<script>
async function loadTransactions() {
  const res = await fetch("/transactions");
  const rows = await res.json();
  const tbody = document.getElementById("tbody");
  const table = document.getElementById("table");
  const empty = document.getElementById("empty");
  tbody.innerHTML = "";

  if (rows.length === 0) {
    table.style.display = "none";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  table.style.display = "table";

  for (const row of rows) {
    const tr = document.createElement("tr");
    const decisionClass = row.decision === "confirm" ? "decision-confirm" : "decision-escalate";
    tr.innerHTML = `
      <td>${row.id}</td>
      <td>${row.merchant}</td>
      <td>${row.amount.toLocaleString()}원</td>
      <td>${row.category ?? "-"}</td>
      <td class="${decisionClass}">${row.decision}</td>
      <td>${row.confidence ?? "-"}</td>
      <td>${row.reason ?? "-"}</td>
      <td>${row.created_at}</td>
    `;
    tbody.appendChild(tr);
  }
}

document.getElementById("refresh").addEventListener("click", loadTransactions);
loadTransactions();
</script>
</body>
</html>
