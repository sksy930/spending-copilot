<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>체크카드 소비 코파일럿</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --border: #e2ded4;
    --text: #121110;
    --text-muted: #6f6a61;
    --accent: #0ea5e9;
    --accent-soft: #e0f4fe;
    --confirm: #0ea5e9;
    --escalate: #d1490f;
    --escalate-soft: #fbe8dd;
    --shadow: 0 1px 2px rgba(20, 18, 12, 0.04), 0 12px 28px rgba(20, 18, 12, 0.06);

    /* 카테고리별 색상 — 색상환에 13개를 균등 배치 + 색맹 시뮬레이션 검증(dataviz 스킬).
       단, 음식점/카페/베이커리/식료품 4개는 "다 먹는 거"라 일부러 같은 주황 계열 톤으로
       묶고 명도만 다르게 뒀다 — CVD 분리 체크는 이 4개끼리는 의도적으로 희생함. */
    --cat-food: #913f27;        --cat-food-soft: #f7eeeb;
    --cat-cafe: #9b5f31;        --cat-cafe-soft: #f7f0eb;
    --cat-bakery: #b47e3c;      --cat-bakery-soft: #f7f2eb;
    --cat-grocery: #be7550;     --cat-grocery-soft: #f7efeb;
    --cat-travel: #2e9e2f;      --cat-travel-soft: #ebf7eb;
    --cat-store: #32ae6d;       --cat-store-soft: #ebf7f1;
    --cat-beauty: #2e9e97;      --cat-beauty-soft: #ebf7f6;
    --cat-transit: #2f84bc;     --cat-transit-soft: #ebf2f7;
    --cat-edu: #2f43bc;         --cat-edu-soft: #ebecf7;
    --cat-medical: #5c2fbc;     --cat-medical-soft: #efebf7;
    --cat-leisure: #9d2fbc;     --cat-leisure-soft: #f5ebf7;
    --cat-apparel: #ae3290;     --cat-apparel-soft: #f7ebf4;
    --cat-shopping: #89851a;    --cat-shopping-soft: #f7f7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d;
      --surface: #19191b;
      --border: #2b2a2c;
      --text: #f4f3ee;
      --text-muted: #9a968d;
      --accent: #38bdf8;
      --accent-soft: #103548;
      --confirm: #38bdf8;
      --escalate: #ff9257;
      --escalate-soft: #3a2617;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px rgba(0, 0, 0, 0.35);

      --cat-food: #d46a49;        --cat-food-soft: #3d2017;
      --cat-cafe: #d19261;        --cat-cafe-soft: #3d2817;
      --cat-bakery: #d4aa77;      --cat-bakery-soft: #3d2c17;
      --cat-grocery: #d7a68e;     --cat-grocery-soft: #3d2417;
      --cat-travel: #29ae2a;      --cat-travel-soft: #173d18;
      --cat-store: #29ae68;       --cat-store-soft: #173d29;
      --cat-beauty: #27a59d;      --cat-beauty-soft: #173d3b;
      --cat-transit: #3090cf;     --cat-transit-soft: #172e3d;
      --cat-edu: #4155d2;         --cat-edu-soft: #171c3d;
      --cat-medical: #8962da;     --cat-medical-soft: #23173d;
      --cat-leisure: #af39d0;     --cat-leisure-soft: #35173d;
      --cat-apparel: #d039ac;     --cat-apparel-soft: #3d1734;
      --cat-shopping: #dad52f;    --cat-shopping-soft: #3d3c17;
    }
  }

  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 1320px;
    margin: 0 auto;
    padding: 48px 32px 80px;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
    overflow-x: hidden;
  }
  .num { font-family: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 44px; flex-wrap: wrap; gap: 8px; }
  header .kicker { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 700; margin: 0 0 8px; }
  header h1 { font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 6px; font-weight: 800; }
  header p { color: var(--text-muted); margin: 0; font-size: 0.96rem; max-width: 520px; }

  .bell-wrap { position: relative; }
  .bell-btn {
    position: relative; width: 40px; height: 40px; border: 1px solid var(--border);
    background: var(--surface); border-radius: 0; font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .bell-badge {
    position: absolute; top: -6px; right: -6px; background: var(--escalate); color: #fff;
    font-size: 0.68rem; font-weight: 700; min-width: 17px; height: 17px; border-radius: 0;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }
  .review-panel {
    position: absolute; top: 48px; right: 0; width: 340px; max-height: 420px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 12px; z-index: 50; display: none;
  }
  .review-panel.open { display: block; }
  .review-panel-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .review-panel-empty { color: var(--text-muted); font-size: 0.85rem; padding: 16px 4px; text-align: center; }
  .review-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .review-item:last-child { border-bottom: none; }
  .review-item-merchant { font-weight: 600; font-size: 0.88rem; }
  .review-item-meta { color: var(--text-muted); font-size: 0.76rem; margin-left: 6px; }
  .review-item-row { display: flex; gap: 6px; margin-top: 6px; }
  .review-item-select { flex: 1; padding: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.82rem; }
  .review-item-save { padding: 6px 10px; border: none; background: var(--accent); color: #fff; font-size: 0.82rem; cursor: pointer; }
  .review-item-save:disabled { opacity: 0.4; cursor: not-allowed; }

  .layout { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
  @media (min-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr) 420px; }
  }
  .main-col, .side-col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

  section h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 0 0 14px;
    font-weight: 700;
  }

  /* --- hero stat --- */
  .hero-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: var(--shadow);
    padding: 28px 32px;
  }
  .hero-label { font-size: 0.9rem; color: var(--text-muted); margin: 0 0 8px; font-weight: 500; }
  .hero-value { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.05; }
  @media (max-width: 640px) {
    .hero-value { font-size: 2rem; }
  }

  /* --- chat --- */
  #chat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  #chat-log {
    height: 253px;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #chat-log:empty::before {
    content: "예: \"이번 주 카페 얼마 썼어?\", \"이번 달 총 얼마 썼어?\"";
    color: var(--text-muted);
    font-size: 0.88rem;
  }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 0; font-size: 0.93rem; white-space: pre-wrap; }
  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
  }
  .msg-assistant {
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--text);
  }
  .msg-error {
    align-self: flex-start;
    background: var(--escalate-soft);
    color: var(--escalate);
  }
  .msg-pending { opacity: 0.6; }
  .msg-trace { margin-top: 8px; font-size: 0.78rem; color: var(--text-muted); }
  .msg-trace summary { cursor: pointer; user-select: none; }
  .trace-call { padding: 4px 0 0 2px; }

  #chat-form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  #chat-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 11px 18px;
    font-size: 0.92rem;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }
  #chat-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #chat-form button {
    border: none;
    border-radius: 0;
    padding: 0 22px;
    background: var(--accent);
    color: #fff;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
  }
  #chat-form button:disabled { opacity: 0.5; cursor: default; }

  /* --- transactions (paginated list) --- */
  #tx-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  #tx-header h2 { margin: 0; }
  #refresh {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 0;
    padding: 5px 14px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .tx-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .tx-list { padding: 6px 20px 0; }
  .tx-row { padding: 13px 0; border-bottom: 1px solid var(--border); }
  .tx-row:last-child { border-bottom: none; }
  .tx-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .tx-row-main { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .tx-merchant { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-amount { font-weight: 700; font-size: 0.96rem; white-space: nowrap; }
  .tx-time { color: var(--text-muted); font-size: 0.74rem; }
  .badge {
    font-size: 0.72rem;
    padding: 3px 9px;
    border-radius: 0;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .badge-escalate { background: var(--escalate-soft); color: var(--escalate); }
  .badge-editable { cursor: pointer; }
  .badge-editable:hover { opacity: 0.75; }
  .badge-edit-select {
    font-size: 0.72rem; font-weight: 600; padding: 3px 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
  }
  #empty { color: var(--text-muted); font-size: 0.9rem; padding: 24px 4px; text-align: center; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .page-btn {
    min-width: 28px;
    height: 28px;
    border: none;
    background: none;
    border-radius: 0;
    color: var(--text-muted);
    font-size: 0.78rem;
    cursor: pointer;
    font-family: "Space Grotesk", inherit;
  }
  .page-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .page-btn-active { background: var(--accent); color: #fff !important; font-weight: 700; }
  .page-btn:disabled { opacity: 0.3; cursor: default; }
  .page-ellipsis { color: var(--text-muted); font-size: 0.78rem; padding: 0 2px; }

  /* --- briefing --- */
  .briefing-content { height: 174px; overflow-y: auto; padding: 18px 20px; font-size: 0.94rem; box-sizing: border-box; }
  .briefing-summary { margin: 0 0 10px; }
  .briefing-total { font-weight: 700; font-size: 1.1rem; margin: 0 0 4px; }
  .briefing-badges { display: flex; flex-wrap: wrap; gap: 6px; }

  /* --- dashboard charts --- */
  .charts-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
  @media (max-width: 640px) {
    .charts-2col { grid-template-columns: 1fr; }
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: var(--shadow);
    padding: 22px;
    min-width: 0;
  }
  .chart-card h3 {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-muted);
    margin: 0 0 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* axis/grid shared by SVG charts */
  .grid-line { stroke: var(--border); stroke-width: 1; shape-rendering: crispEdges; }
  .axis-tick { fill: var(--text-muted); font-size: 8px; font-family: "Space Grotesk", sans-serif; }
  .x-tick { fill: var(--text-muted); font-size: 7.5px; font-family: "Space Grotesk", sans-serif; }
  .value-label { fill: var(--text); font-size: 9px; font-weight: 700; font-family: "Space Grotesk", sans-serif; }

  /* --- calendar heatmap --- */
  .heatmap-wrap { display: flex; gap: 8px; }
  .heatmap-daylabels {
    display: grid;
    grid-template-rows: repeat(7, 14px);
    gap: 3px;
    padding-top: 18px;
    flex-shrink: 0;
  }
  .heatmap-daylabels span { font-size: 9px; color: var(--text-muted); line-height: 14px; }
  .heatmap-scroll { overflow-x: auto; padding-bottom: 4px; flex: 1; min-width: 0; }
  .heatmap-months {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 14px;
    column-gap: 3px;
    height: 14px;
    margin-bottom: 4px;
  }
  .heatmap-month-label { font-size: 9px; color: var(--text-muted); white-space: nowrap; }
  .heatmap-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 14px);
    grid-auto-columns: 14px;
    gap: 3px;
  }
  .heatmap-cell { width: 14px; height: 14px; border-radius: 0; cursor: default; }
  .heatmap-cell.level-empty { background: transparent; }
  .heatmap-cell.level-0 { background: color-mix(in oklab, var(--accent) 12%, var(--surface)); }
  .heatmap-cell.level-1 { background: color-mix(in oklab, var(--accent) 32%, var(--surface)); }
  .heatmap-cell.level-2 { background: color-mix(in oklab, var(--accent) 55%, var(--surface)); }
  .heatmap-cell.level-3 { background: color-mix(in oklab, var(--accent) 78%, var(--surface)); }
  .heatmap-cell.level-4 { background: var(--accent); }
  .heatmap-cell:not(.level-empty) { cursor: pointer; }
  .heatmap-cell:not(.level-empty):hover,
  .heatmap-cell:not(.level-empty):focus-visible { outline: 2px solid var(--text-muted); outline-offset: 1px; }
  .heatmap-legend { display: flex; align-items: center; gap: 4px; margin-top: 12px; font-size: 9px; color: var(--text-muted); }
  .legend-cell { width: 10px; height: 10px; border-radius: 0; }

  /* --- 일별 소비 상세 팝오버 (클릭한 칸 옆에 붙어서 뜸) --- */
  .day-detail-overlay {
    display: none; position: fixed; inset: 0; background: transparent; z-index: 100;
  }
  .day-detail-overlay.open { display: block; }
  .day-detail-panel {
    position: absolute; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    width: 300px; max-width: calc(100vw - 24px); max-height: 70vh; display: flex; flex-direction: column;
  }
  .day-detail-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 18px 20px; border-bottom: 1px solid var(--border);
  }
  .day-detail-date { font-weight: 700; font-size: 1rem; margin: 0 0 4px; }
  .day-detail-total { color: var(--text-muted); font-size: 0.84rem; margin: 0; }
  .day-detail-close {
    border: none; background: none; color: var(--text-muted); font-size: 1rem; cursor: pointer;
    padding: 2px 6px;
  }
  .day-detail-close:hover { color: var(--text); }
  .day-detail-list { overflow-y: auto; padding: 6px 20px 18px; }
  .day-detail-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .day-detail-row:last-child { border-bottom: none; }
  .day-detail-row-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .day-detail-merchant { font-weight: 600; font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day-detail-meta { display: flex; align-items: center; gap: 6px; }
  .day-detail-time { color: var(--text-muted); font-size: 0.72rem; }
  .day-detail-amount { font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
  .day-detail-empty { color: var(--text-muted); font-size: 0.88rem; text-align: center; padding: 24px 0; }

  /* --- weekly trend line --- */
  #weekly-chart-svg { width: 100%; height: 150px; display: block; overflow: visible; }
  .weekly-area { fill: var(--accent); opacity: 0.12; }
  .weekly-line { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .weekly-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; cursor: default; }
  .weekly-dot:hover, .weekly-dot:focus-visible { opacity: 0.75; outline: none; }

  /* --- category bars --- */
  .cat-list { display: flex; flex-direction: column; gap: 9px; }
  .cat-row {
    display: grid;
    grid-template-columns: 74px 1fr auto;
    align-items: center;
    gap: 10px;
  }
  .cat-name {
    font-size: 0.84rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-track { position: relative; height: 14px; }
  .cat-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    min-width: 3px;
    background: var(--accent);
    border-radius: 0;
  }
  .cat-value {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #dashboard-empty { color: var(--text-muted); font-size: 0.9rem; padding: 24px 4px; text-align: center; }
</style>
</head>
<body>
  <header>
    <div>
      <p class="kicker">Personal Finance Copilot</p>
      <h1>체크카드 소비 코파일럿</h1>
    </div>
    <div class="bell-wrap">
      <button id="review-bell" class="bell-btn" title="검토 필요한 거래">
        🔔<span id="review-badge" class="bell-badge" style="display:none">0</span>
      </button>
      <div id="review-panel" class="review-panel">
        <p class="review-panel-title">카테고리 확인 필요</p>
        <div id="review-panel-body"></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="main-col">
      <section>
        <h2>소비 한눈에 보기</h2>
        <div id="dashboard">
          <div class="hero-stat">
            <p class="hero-label" id="hero-label">이번 달 지출</p>
            <p class="hero-value num" id="hero-value">-</p>
          </div>
          <div class="charts-2col">
            <div class="chart-card">
              <h3>요일별 지출 패턴</h3>
              <div class="heatmap-wrap">
                <div class="heatmap-daylabels">
                  <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                </div>
                <div class="heatmap-scroll">
                  <div class="heatmap-months" id="heatmap-months"></div>
                  <div class="heatmap-grid" id="heatmap-grid"></div>
                </div>
              </div>
              <div class="heatmap-legend">
                <span>적음</span>
                <span class="legend-cell" style="background:color-mix(in oklab, var(--accent) 12%, var(--surface))"></span>
                <span class="legend-cell" style="background:color-mix(in oklab, var(--accent) 32%, var(--surface))"></span>
                <span class="legend-cell" style="background:color-mix(in oklab, var(--accent) 55%, var(--surface))"></span>
                <span class="legend-cell" style="background:color-mix(in oklab, var(--accent) 78%, var(--surface))"></span>
                <span class="legend-cell" style="background:var(--accent)"></span>
                <span>많음</span>
              </div>
            </div>
            <div class="chart-card">
              <h3>주간 지출 추세</h3>
              <svg id="weekly-chart-svg"></svg>
            </div>
          </div>
          <div class="chart-card">
            <h3>카테고리별 지출</h3>

<script>
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

const KST_DATETIME_FMT = new Intl.DateTimeFormat("ko-KR", {
  timeZone: "Asia/Seoul", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
});
const KST_DATE_FMT = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }); // "YYYY-MM-DD"
const KST_TIME_ONLY_FMT = new Intl.DateTimeFormat("ko-KR", {
  timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false,
});

function kstDateKey(isoString) {
  // 히트맵의 날짜(YYYY-MM-DD, KST 기준 집계)랑 대조하려면 거래 시각도 같은 방식으로 변환해야 한다.
  return KST_DATE_FMT.format(new Date(isoString));
}

function formatKstDateTime(isoString) {
  // API가 UTC로 내려주므로(예: "2026-08-20T03:06:00Z") 문자열을 그대로 자르면 안 되고
  // 반드시 시간대 변환을 거쳐야 한국 시각이 맞게 나온다.
  const parts = KST_DATETIME_FMT.formatToParts(new Date(isoString));
  const get = (type) => parts.find((p) => p.type === type).value;
  return `${get("month")}/${get("day")} ${get("hour")}:${get("minute")}`;
}

async function loadBriefing() {
  const content = document.getElementById("briefing-content");
  try {
    const res = await fetch("/briefing");
    const data = await res.json();
    let html = `<p class="briefing-total num">${data.total.toLocaleString()}원 · ${data.count}건</p>`;
    html += `<p class="briefing-summary">${escapeHtml(data.summary)}</p>`;
    if (data.by_category && data.by_category.length > 0) {
      html += '<div class="briefing-badges">' + data.by_category.map(
        (c) => `<span class="badge">${escapeHtml(c.category)} ${c.total.toLocaleString()}원</span>`
      ).join("") + "</div>";
    }
    content.innerHTML = html;
  } catch (err) {
    content.textContent = "요약을 불러오지 못했어요.";
  }
}

function formatCompact(amount) {
  if (amount >= 10000) {
    const man = amount / 10000;
    return (Number.isInteger(man) ? man.toFixed(0) : man.toFixed(1)) + "만";
  }
  return amount.toLocaleString();
}

const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/* --- 요일별 지출 패턴 (calendar heatmap) --- */
function levelFor(total, max) {
  if (total <= 0) return 0;
  const ratio = total / max;
  if (ratio > 0.75) return 4;
  if (ratio > 0.5) return 3;
  if (ratio > 0.25) return 2;
  return 1;
}

function renderHeatmap(daily) {
  const grid = document.getElementById("heatmap-grid");
  const monthsRow = document.getElementById("heatmap-months");
  grid.textContent = "";
  monthsRow.textContent = "";
  if (daily.length === 0) return;

  const max = Math.max(...daily.map((d) => d.total), 1);
  const firstDate = new Date(daily[0].date + "T00:00:00");
  const leadingEmpty = firstDate.getDay(); // 0=일

  for (let i = 0; i < leadingEmpty; i++) {
    const pad = document.createElement("div");
    pad.className = "heatmap-cell level-empty";
    grid.appendChild(pad);
  }

  let lastMonth = null;
  let cellCount = leadingEmpty;

  for (const d of daily) {
    const date = new Date(d.date + "T00:00:00");
    const level = levelFor(d.total, max);
    const cell = document.createElement("div");
    cell.className = `heatmap-cell level-${level}`;
    cell.tabIndex = 0;
    cell.dataset.date = d.date;
    const [, month, day] = d.date.split("-");
    cell.title = `${parseInt(month, 10)}/${parseInt(day, 10)}: ${d.total.toLocaleString()}원`;
    grid.appendChild(cell);

    const monthNum = date.getMonth();
    if (monthNum !== lastMonth) {
      lastMonth = monthNum;
      const colIndex = Math.floor(cellCount / 7) + 1;
      const label = document.createElement("span");
      label.className = "heatmap-month-label";
      label.style.gridColumnStart = String(colIndex);
      label.textContent = `${monthNum + 1}월`;
      monthsRow.appendChild(label);
    }
    cellCount++;
  }

  // 데이터 기간이 짧으면(예: 앱 초기 사용) 칸이 몇 개 안 돼서 카드 오른쪽이 휑해
  // 보인다 — 고정 주차 수를 추측해서 채우는 대신, 실제 렌더링된 카드 폭을 재서
  // 그 폭을 딱 채울 만큼만 빈 칸(투명, 클릭 불가)으로 이어붙인다.
  const CELL_PITCH = 17; // .heatmap-cell 14px + .heatmap-grid gap 3px
  const scrollEl = document.querySelector(".heatmap-scroll");
  const availableWidth = scrollEl ? scrollEl.clientWidth : 0;
  const minColumns = availableWidth > 0 ? Math.ceil(availableWidth / CELL_PITCH) : 12;
  for (; cellCount < minColumns * 7; cellCount++) {
    const pad = document.createElement("div");
    pad.className = "heatmap-cell level-empty";
    grid.appendChild(pad);
  }
}

/* --- 주간 지출 추세 (line + area) --- */
function renderWeeklyTrend(weekly) {
  const svg = document.getElementById("weekly-chart-svg");
  svg.textContent = "";
  if (weekly.length === 0) return;

  const width = svg.clientWidth || 400;
  const height = 150;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  const leftPad = 36;
  const rightPad = 14;
  const topPad = 20;
  const bottomPad = 18;
  const plotW = width - leftPad - rightPad;
  const plotH = height - topPad - bottomPad;
  const baseline = topPad + plotH;

  const maxTotal = Math.max(...weekly.map((w) => w.total), 1);
  const n = weekly.length;
  const stepX = n > 1 ? plotW / (n - 1) : 0;

  [0, 0.5, 1].forEach((frac) => {
    const y = baseline - plotH * frac;
    svg.appendChild(svgEl("line", { class: "grid-line", x1: leftPad, x2: width - rightPad, y1: y, y2: y }));
    const label = svgEl("text", { class: "axis-tick", x: leftPad - 6, y: y + 3, "text-anchor": "end" });
    label.textContent = formatCompact(Math.round(maxTotal * frac));
    svg.appendChild(label);
  });

  const points = weekly.map((w, i) => ({
    x: leftPad + i * stepX,
    y: baseline - (w.total / maxTotal) * plotH,
    w,
  }));

  const areaPath = `M${points[0].x},${baseline} ` +
    points.map((p) => `L${p.x},${p.y}`).join(" ") +
    ` L${points[points.length - 1].x},${baseline} Z`;
  svg.appendChild(svgEl("path", { d: areaPath, class: "weekly-area" }));

  const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + `${p.x},${p.y}`).join(" ");
  svg.appendChild(svgEl("path", { d: linePath, class: "weekly-line" }));

  points.forEach((p, i) => {
    const start = new Date(p.w.week_start + "T00:00:00");
    const label = `${start.getMonth() + 1}/${start.getDate()}`;

    const dot = svgEl("circle", { cx: p.x, cy: p.y, r: 4, class: "weekly-dot", tabindex: "0" });
    const title = svgEl("title", {});
    title.textContent = `${label}주: ${p.w.total.toLocaleString()}원`;
    dot.appendChild(title);
    svg.appendChild(dot);

    if (i === points.length - 1) {
      const valueLabel = svgEl("text", { class: "value-label", x: p.x, y: Math.max(p.y - 10, 10), "text-anchor": "end" });
      valueLabel.textContent = formatCompact(p.w.total);
      svg.appendChild(valueLabel);
    }

    const tick = svgEl("text", { class: "x-tick", x: p.x, y: height - 4, "text-anchor": "middle" });
    tick.textContent = label;
    svg.appendChild(tick);
  });
}

/* --- 카테고리별 지출 (ranked bars) --- */
function renderCategoryChart(byCategory) {

/* --- 최근 거래 (페이지네이션) --- */
let allTransactions = [];
let currentPage = 1;
const PAGE_SIZE = 8;

async function loadTransactions() {
  const res = await fetch("/transactions");
  allTransactions = await res.json();
  currentPage = 1;
  renderTransactionsPage();
}

function paginationRange(current, total) {
  const delta = 1;
  const range = [];
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || (i >= current - delta && i <= current + delta)) {
      range.push(i);
    }
  }
  const withEllipsis = [];
  let prev = null;
  for (const p of range) {
    if (prev !== null && p - prev > 1) withEllipsis.push("…");
    withEllipsis.push(p);
    prev = p;
  }
  return withEllipsis;
}

function renderPaginationControls(container, totalPages) {
  container.textContent = "";

  const prev = document.createElement("button");
  prev.className = "page-btn page-nav";
  prev.textContent = "‹";
  prev.disabled = currentPage === 1;
  prev.addEventListener("click", () => { currentPage--; renderTransactionsPage(); });
  container.appendChild(prev);

  for (const p of paginationRange(currentPage, totalPages)) {
    if (p === "…") {
      const span = document.createElement("span");
      span.className = "page-ellipsis";
      span.textContent = "…";
      container.appendChild(span);
      continue;
    }
    const btn = document.createElement("button");
    btn.className = "page-btn num" + (p === currentPage ? " page-btn-active" : "");
    btn.textContent = String(p);
    btn.addEventListener("click", () => { currentPage = p; renderTransactionsPage(); });
    container.appendChild(btn);
  }

  const next = document.createElement("button");
  next.className = "page-btn page-nav";
  next.textContent = "›";
  next.disabled = currentPage === totalPages;
  next.addEventListener("click", () => { currentPage++; renderTransactionsPage(); });
  container.appendChild(next);
}

function renderTransactionsPage() {
  const list = document.getElementById("tx-list");
  const card = document.getElementById("tx-card");
  const empty = document.getElementById("empty");
  const pagination = document.getElementById("tx-pagination");
  list.innerHTML = "";

  if (allTransactions.length === 0) {
    card.style.display = "none";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  card.style.display = "block";

  const totalPages = Math.ceil(allTransactions.length / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = allTransactions.slice(start, start + PAGE_SIZE);

  for (const row of pageRows) {
    const div = document.createElement("div");
    div.className = "tx-row";
    const isConfirm = row.decision === "confirm";
    const badgeClass = isConfirm ? "badge badge-editable" : "badge badge-escalate badge-editable";
    const badgeText = isConfirm ? (row.category ?? "확정") : "리뷰 필요";
    const badgeStyle = categoryBadgeStyle(isConfirm ? row.category : null);
    const dateTime = formatKstDateTime(row.created_at);
    div.innerHTML = `
      <div class="tx-row-top">
        <span class="${badgeClass}"${badgeStyle} data-tx-id="${row.id}" data-tx-category="${escapeHtml(row.category ?? "")}" title="눌러서 카테고리 수정">${escapeHtml(badgeText)}</span>
        <span class="tx-time num">${escapeHtml(dateTime)}</span>
      </div>
      <div class="tx-row-main">
        <span class="tx-merchant">${escapeHtml(row.merchant)}</span>
        <span class="tx-amount num">${row.amount.toLocaleString()}원</span>
      </div>
    `;
    list.appendChild(div);
  }

  pagination.style.display = totalPages > 1 ? "flex" : "none";
  if (totalPages > 1) {
    renderPaginationControls(pagination, totalPages);
  }
}

const PERIOD_LABELS = {
  this_week: "이번 주", last_week: "지난주", this_month: "이번 달", last_month: "지난달", all: "전체 기간",
};

function formatTraceCall(index, call) {
  const parts = [PERIOD_LABELS[call.period] ?? call.period];
  if (call.category) parts.push(call.category);
  if (call.merchant) parts.push(`"${call.merchant}"`);
  const label = parts.join(" · ");
  const r = call.result || {};
  if (r.error) return `${index}. ${label} → 오류: ${r.error}`;
  return `${index}. ${label} → ${(r.total ?? 0).toLocaleString()}원 (${r.count ?? 0}건)`;
}

function appendMessage(text, kind, trace, usedLlm) {
  const log = document.getElementById("chat-log");
  const div = document.createElement("div");
  div.className = `msg msg-${kind}`;

  const textEl = document.createElement("div");
  textEl.textContent = text;
  div.appendChild(textEl);

  if (trace && trace.length > 0) {
    const details = document.createElement("details");
    details.className = "msg-trace";
    const summary = document.createElement("summary");
    summary.textContent = usedLlm
      ? `🔍 AI가 ${trace.length}단계 조회함`
      : `⚡ 즉답 (AI 미사용, ${trace.length}건 조회)`;
    details.appendChild(summary);
    trace.forEach((call, i) => {
      const line = document.createElement("div");
      line.className = "trace-call";
      line.textContent = formatTraceCall(i + 1, call);
      details.appendChild(line);
    });
    div.appendChild(details);
  }

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

document.getElementById("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chat-input");
  const button = document.getElementById("chat-submit");
  const question = input.value.trim();
  if (!question) return;

  appendMessage(question, "user");
  input.value = "";
  input.disabled = true;
  button.disabled = true;
  const pending = appendMessage("생각하는 중...", "assistant");
  pending.classList.add("msg-pending");

  try {
    const res = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    pending.remove();
    if (!res.ok) {
      appendMessage(data.detail ?? "질문 처리에 실패했어요.", "error");
    } else {
      appendMessage(data.answer, "assistant", data.calls, data.used_llm);
      loadTransactions();
    }
  } catch (err) {
    pending.remove();
    appendMessage("서버에 연결하지 못했어요.", "error");
  } finally {
    input.disabled = false;
    button.disabled = false;
    input.focus();
  }
});

  "교육", "여가/오락", "의료", "미용", "교통", "여행", "기타",

// 카테고리 → CSS 변수 슬러그. "기타"는 일부러 안 넣음 — 지정 카테고리가 없다는

  "여행": "travel", "편의점": "store", "미용": "beauty", "교통": "transit",

};

function categoryBadgeStyle(category) {

function categoryColorVar(category) {

function renderPendingReviews(items) {
  const badge = document.getElementById("review-badge");
  const body = document.getElementById("review-panel-body");

  if (items.length === 0) {
    badge.style.display = "none";
  } else {
    badge.textContent = String(items.length);
    badge.style.display = "flex";
  }

  body.innerHTML = "";
  if (items.length === 0) {
    const empty = document.createElement("div");
    empty.className = "review-panel-empty";
    empty.textContent = "검토할 거래가 없어요.";
    body.appendChild(empty);
    return;
  }

  for (const row of items) {
    const div = document.createElement("div");
    div.className = "review-item";
    const dateTime = formatKstDateTime(row.created_at);

    const info = document.createElement("div");
    const merchantSpan = document.createElement("span");
    merchantSpan.className = "review-item-merchant";
    merchantSpan.textContent = row.merchant;
    const metaSpan = document.createElement("span");
    metaSpan.className = "review-item-meta";
    metaSpan.textContent = `${row.amount.toLocaleString()}원 · ${dateTime}`;
    info.appendChild(merchantSpan);
    info.appendChild(metaSpan);
    div.appendChild(info);

    const rowDiv = document.createElement("div");
    rowDiv.className = "review-item-row";

    const select = document.createElement("select");
    select.className = "review-item-select";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "카테고리 선택";
    select.appendChild(placeholder);
    for (const c of REVIEW_CATEGORIES) {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    }

    const saveBtn = document.createElement("button");
    saveBtn.className = "review-item-save";
    saveBtn.textContent = "저장";
    saveBtn.disabled = true;

    select.addEventListener("change", () => {
      saveBtn.disabled = !select.value;
    });

    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = "저장 중...";
      try {
        const res = await fetch(`/review/${row.id}/resolve`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ category: select.value }),
        });
        if (!res.ok) throw new Error(await res.text());
        await loadPendingReviews();
        loadTransactions();
        loadDashboard();
      } catch (err) {
        alert("저장에 실패했어요.");
        saveBtn.disabled = false;
        saveBtn.textContent = "저장";
      }
    });

    rowDiv.appendChild(select);
    rowDiv.appendChild(saveBtn);
    div.appendChild(rowDiv);
    body.appendChild(div);
  }
}

async function loadPendingReviews() {
  const res = await fetch("/review");
  renderPendingReviews(await res.json());
}

document.getElementById("review-bell").addEventListener("click", () => {
  document.getElementById("review-panel").classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!document.querySelector(".bell-wrap").contains(e.target)) {
    document.getElementById("review-panel").classList.remove("open");
  }
});

document.getElementById("tx-list").addEventListener("click", (e) => {
  const badge = e.target.closest(".badge-editable");
  if (!badge) return;

  const txId = badge.dataset.txId;
  const currentCategory = badge.dataset.txCategory;

  const select = document.createElement("select");
  select.className = "badge-edit-select";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "카테고리 선택";
  placeholder.disabled = true;
  placeholder.selected = !currentCategory;
  select.appendChild(placeholder);
  for (const c of REVIEW_CATEGORIES) {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    if (c === currentCategory) opt.selected = true;
    select.appendChild(opt);
  }

  select.addEventListener("change", async () => {
    select.disabled = true;
    try {
      const res = await fetch(`/review/${txId}/resolve`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: select.value }),
      });
      if (!res.ok) throw new Error(await res.text());
      loadTransactions();
      loadDashboard();
      loadPendingReviews();
    } catch (err) {
      alert("저장에 실패했어요.");
      loadTransactions();
    }
  });
  select.addEventListener("blur", () => {
    if (!select.disabled) loadTransactions(); // 선택 안 하고 포커스만 벗어나면 원상복구
  });

  badge.replaceWith(select);
  select.focus();
});

const DAY_DETAIL_DATE_FMT = new Intl.DateTimeFormat("ko-KR", {
  timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric", weekday: "short",
});

function positionDayDetailPanel(anchorRect) {
  const panel = document.querySelector(".day-detail-panel");
  const margin = 8;
  const panelWidth = panel.offsetWidth || 300;

  let left = anchorRect.right + margin;
  if (left + panelWidth > window.innerWidth - margin) {
    left = anchorRect.left - panelWidth - margin; // 오른쪽에 자리 없으면 왼쪽에
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - panelWidth - margin));

  let top = anchorRect.top;
  const panelHeight = panel.offsetHeight || 200;
  if (top + panelHeight > window.innerHeight - margin) {
    top = Math.max(margin, window.innerHeight - panelHeight - margin);
  }

  panel.style.left = `${left}px`;
  panel.style.top = `${top}px`;
}

function showDayDetail(dateStr, anchorRect) {
  const rows = allTransactions.filter((row) => kstDateKey(row.created_at) === dateStr);
  rows.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const total = rows.reduce((sum, row) => sum + row.amount, 0);
  document.getElementById("day-detail-date").textContent = DAY_DETAIL_DATE_FMT.format(new Date(dateStr + "T00:00:00"));
  document.getElementById("day-detail-total").textContent = rows.length === 0
    ? "소비 내역 없음"
    : `${total.toLocaleString()}원 · ${rows.length}건`;

  const list = document.getElementById("day-detail-list");
  list.textContent = "";
  if (rows.length === 0) {
    const empty = document.createElement("div");
    empty.className = "day-detail-empty";
    empty.textContent = "이 날은 기록된 소비가 없어요.";
    list.appendChild(empty);
  } else {
    for (const row of rows) {
      const div = document.createElement("div");
      div.className = "day-detail-row";
      const isConfirm = row.decision === "confirm";
      const badgeText = isConfirm ? (row.category ?? "확정") : "리뷰 필요";
      const badgeStyle = categoryBadgeStyle(isConfirm ? row.category : null);
      const badgeClass = isConfirm ? "badge" : "badge badge-escalate";
      div.innerHTML = `
        <div class="day-detail-row-left">
          <span class="day-detail-merchant">${escapeHtml(row.merchant)}</span>
          <span class="day-detail-meta">
            <span class="${badgeClass}"${badgeStyle}>${escapeHtml(badgeText)}</span>
            <span class="day-detail-time">${KST_TIME_ONLY_FMT.format(new Date(row.created_at))}</span>
          </span>
        </div>
        <span class="day-detail-amount num">${row.amount.toLocaleString()}원</span>
      `;
      list.appendChild(div);
    }
  }

  document.getElementById("day-detail-overlay").classList.add("open");
  positionDayDetailPanel(anchorRect);
}

function closeDayDetail() {
  document.getElementById("day-detail-overlay").classList.remove("open");
}

document.getElementById("heatmap-grid").addEventListener("click", (e) => {
  const cell = e.target.closest(".heatmap-cell");
  if (!cell || !cell.dataset.date) return;
  showDayDetail(cell.dataset.date, cell.getBoundingClientRect());
});
document.getElementById("heatmap-grid").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const cell = e.target.closest(".heatmap-cell");
  if (!cell || !cell.dataset.date) return;
  e.preventDefault();
  showDayDetail(cell.dataset.date, cell.getBoundingClientRect());
});
document.getElementById("day-detail-close").addEventListener("click", closeDayDetail);
document.getElementById("day-detail-overlay").addEventListener("click", (e) => {
  if (e.target.id === "day-detail-overlay") closeDayDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDayDetail();
});

document.getElementById("refresh").addEventListener("click", loadTransactions);
loadTransactions();
loadBriefing();
loadDashboard();
loadPendingReviews();
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(loadDashboard, 200);
});
</script>
